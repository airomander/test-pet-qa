name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SAUCE_HEADLESS: "true"
  SAUCE_REQRES_API_KEY: ${{ secrets.SAUCE_REQRES_API_KEY }}

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.4.1"

      - name: Install dependencies
        run: poetry install

      - name: Install Playwright browsers
        run: poetry run playwright install chromium

      - name: Run UI tests (shard ${{ matrix.shard }})
        run: |
          poetry run pytest tests/ui/ -v \
            --alluredir=allure-results \
            --shard-id=${{ matrix.shard }} \
            --num-shards=3

      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui-shard-${{ matrix.shard }}
          path: allure-results/

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.4.1"

      - name: Install dependencies
        run: poetry install

      - name: Run API tests
        run: poetry run pytest tests/api/ -v --alluredir=allure-results

      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: allure-results/

  allure-report:
    if: always()
    needs: [ui-tests, api-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results-download
          merge-multiple: true

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@v1.11
        with:
          allure_results: allure-results-download
          allure_history: allure-history

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-history

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
