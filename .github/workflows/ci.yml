name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SAUCE_HEADLESS: "true"
  SAUCE_REQRES_API_KEY: ${{ secrets.SAUCE_REQRES_API_KEY }}

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.4.1"

      - name: Install dependencies
        run: poetry install

      - name: Install Playwright browsers
        run: poetry run playwright install chromium

      - name: Run UI tests (shard ${{ matrix.shard }})
        run: |
          poetry run pytest tests/ui/ -v \
            --alluredir=allure-results \
            --shard-id=${{ matrix.shard }} \
            --num-shards=3

      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui-shard-${{ matrix.shard }}
          path: allure-results/

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.4.1"

      - name: Install dependencies
        run: poetry install

      - name: Install Playwright browsers
        run: poetry run playwright install chromium

      - name: Run API tests (health-check auto-skips if key is invalid)
        run: poetry run pytest tests/api/ -v --alluredir=allure-results

      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: allure-results/

  allure-report:
    if: always()
    needs: [ui-tests, api-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results-download
          merge-multiple: true

      - name: Install Allure CLI
        run: |
          curl -sLO https://github.com/allure-framework/allure2/releases/download/2.33.0/allure-2.33.0.tgz
          tar -xzf allure-2.33.0.tgz
          echo "$PWD/allure-2.33.0/bin" >> $GITHUB_PATH

      - name: Generate Allure report
        run: |
          allure generate allure-results-download --clean -o allure-report-out

      - name: Upload Allure report artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report-out/
